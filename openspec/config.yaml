schema: spec-driven

context: |
  Product: AI medical interpreter and verified record for patient and physician consultations across a language barrier.
  Primary market: Canada (high immigration and linguistic diversity). English and French are official languages; French-language service rights apply in Quebec, New Brunswick, and designated areas of Ontario and elsewhere.
  First-version languages: English, French, Mandarin, Cantonese, Punjabi, Urdu, Arabic, Farsi, Tagalog, Spanish, Portuguese, Sinhala, and Tamil.
  In-room setup: a large shared screen (TV or monitor) shows live bilingual captions to both parties; translated speech is also spoken aloud.
  Baseline benchmarks: Abridge (Linked Evidence) for the record; No Barrier and Care to Translate for interpretation. Research: docs/product-research.md.
  Core principle: the patient is a verifier of the record, in their own language, not a passive subject.
  Every statement in a clinical note must be traceable to who said it, in which language, and how it was translated, or marked as AI inference.
  Machine translation quality varies by language; low-resource languages and high-risk moments must offer a qualified human interpreter.
  Compliance: PIPEDA, PHIPA (Ontario), Quebec Law 25, and other provincial health privacy acts; HIPAA, GDPR, and UK GDPR for later markets. Vendors handling PHI need a DPA or BAA, and Canadian data residency must be available.
  The physician remains the final author of the medical record.
  Communication feedback is private to the physician and never shown to the patient or employer by default.
  Technical decisions live as DDSE records in openspec/tdr/ (index.md); designs cite them and do not decide silently.
  Write all artifacts in UK English with the Oxford comma; avoid em-dashes.

# Rules binding OpenSpec (what) to the DDSE decision layer in openspec/tdr/ (why and how).
rules:
  proposal:
    - 'List the TDRs the change relies on by id (for example ADR-004), and any decisions that still need a TDR'
    - 'State what is out of scope'
  specs:
    - 'Describe observable behaviour only; vendor, library, and framework names belong in TDRs, not specs'
  design:
    - 'Every technical choice cites the TDR that makes it (for example "per ADR-004")'
    - 'A choice without an accepted TDR goes under Open Questions, with a proposed TDR drafted from openspec/tdr/templates/'
  tasks:
    - 'Every task group starts with a line "TDRs: <ids>" listing the decisions it depends on'
    - 'Group 0 is a human decision review gate for every proposed TDR the change relies on'
    - 'Every task names its verification (test, command, or observable behaviour)'

operations:
  apply:
    guidance:
      - 'Read openspec/tdr/index.md and the TDRs listed for the task group first, starting from MDD, then ADR, then CDR, EDR, and IDR; use each record''s ai_context'
      - 'Run python3 scripts/check_tdr.py; do not start a task whose TDRs are not accepted'
      - 'When a new architectural, contract, vendor, data, safety, or privacy choice is needed, draft a proposed TDR from openspec/tdr/templates/ with proposed_by agent, add it to openspec/tdr/index.md, and stop for human review'
      - 'Never decide a TDR status; humans decide. Change a status only to record an explicit verdict a named human gave in this session and asked you to record, naming them in Review Notes and the commit (EDR-001 rule 7)'
      - 'Annotate governed code with "@implements <TDR-ID>: <title>", "@contract <endpoint or schema>" for CDR-governed code, and "@see <path>"'
      - 'Reference TDR ids in commit messages, for example "feat: live turn graph (ADR-004, CDR-002)"'
  archive:
    guidance:
      - 'Confirm every TDR cited by the change is accepted or superseded'
      - 'Fill implementation_refs and test_refs in each cited TDR before archiving'
