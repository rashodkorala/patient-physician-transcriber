# The interpreter's own lines in English, spoken at the start of a visit (MDD-004, CDR-003).
# Fixed text, never model-written. {physician} and {patient} are the visit's names.
reviewer: pending
lines:
  introduction: Hello, I'm the interpreter for this visit. I'll pass on everything each of you says, in your own language.
  ask_physician_name: Doctor, what name should I use for you?
  ask_patient_name: May I have your name, please?
  ask_patient_name_with_physician: "{physician} is your doctor today. May I have your name, please?"
  welcome: Thank you. Please go ahead whenever you're ready.
  welcome_with_patient: Thank you, {patient}. Please go ahead whenever you're ready.
  # CDR-008: the patient's signals relayed to the physician, and the closing check asked of the patient.
  signal_not_understood: "{patient} is saying they did not understand that. Could you say it another way?"
  signal_not_understood_unnamed: "The patient is saying they did not understand that. Could you say it another way?"
  signal_slower: "{patient} is asking you to speak more slowly."
  signal_slower_unnamed: "The patient is asking you to speak more slowly."
  ask_if_clear: "{patient}, is there anything the doctor said today that you would like explained again?"
  ask_if_clear_unnamed: "Is there anything the doctor said today that you would like explained again?"
  # ADR-003: said to the speaker of an unclear turn, in their language only. {name} is that speaker's name.
  ask_to_repeat: "Sorry, I did not catch that. Could you say it again?"
  ask_to_repeat_named: "Sorry, {name}, I did not catch that. Could you say it again?"
