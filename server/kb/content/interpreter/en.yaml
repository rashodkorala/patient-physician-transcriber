# The interpreter's own lines in English, spoken at the start of a visit (MDD-004, CDR-003).
# Fixed text, never model-written. {physician} and {patient} are the visit's names.
reviewer: pending
lines:
  introduction: Hello, I'm the interpreter for this visit. I'll pass on everything each of you says, in your own language.
  ask_physician_name: Doctor, what name should I use for you?
  ask_patient_name: May I have your name, please?
  ask_patient_name_with_physician: "{physician} is your doctor today. May I have your name, please?"
  welcome: Thank you. Please go ahead whenever you're ready.
  welcome_with_patient: Thank you, {patient}. Please go ahead whenever you're ready.
