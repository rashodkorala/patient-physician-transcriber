# The interpreter's own lines in Punjabi. Draft by Claude: Punjabi speaker to review.
# First-person verbs are gendered in Punjabi, so these use forms that avoid the interpreter's gender
# (a passive "will be told" instead of ਦੱਸਾਂਗਾ or ਦੱਸਾਂਗੀ). Check they still sound natural, and that
# ਦੁਭਾਸ਼ੀਆ suits the voice chosen in the listening test.
reviewer: pending
lines:
  introduction: ਸਤ ਸ੍ਰੀ ਅਕਾਲ ਜੀ। ਮੈਂ ਇਸ ਮੁਲਾਕਾਤ ਲਈ ਦੁਭਾਸ਼ੀਆ ਹਾਂ। ਤੁਸੀਂ ਦੋਵੇਂ ਜੋ ਵੀ ਕਹੋਗੇ, ਉਹ ਤੁਹਾਡੀ ਆਪਣੀ ਬੋਲੀ ਵਿੱਚ ਦੱਸਿਆ ਜਾਵੇਗਾ।
  ask_physician_name: ਡਾਕਟਰ ਜੀ, ਮੈਂ ਤੁਹਾਨੂੰ ਕਿਸ ਨਾਮ ਨਾਲ ਬੁਲਾਵਾਂ?
  ask_patient_name: ਕਿਰਪਾ ਕਰਕੇ ਆਪਣਾ ਨਾਮ ਦੱਸੋ ਜੀ।
  ask_patient_name_with_physician: ਅੱਜ {physician} ਤੁਹਾਡੇ ਡਾਕਟਰ ਹਨ। ਕਿਰਪਾ ਕਰਕੇ ਆਪਣਾ ਨਾਮ ਦੱਸੋ ਜੀ।
  welcome: ਧੰਨਵਾਦ ਜੀ। ਜਦੋਂ ਤੁਸੀਂ ਤਿਆਰ ਹੋਵੋ, ਗੱਲ ਸ਼ੁਰੂ ਕਰ ਸਕਦੇ ਹੋ।
  welcome_with_patient: ਧੰਨਵਾਦ {patient} ਜੀ। ਜਦੋਂ ਤੁਸੀਂ ਤਿਆਰ ਹੋਵੋ, ਗੱਲ ਸ਼ੁਰੂ ਕਰ ਸਕਦੇ ਹੋ।
  # CDR-008: the patient's signals relayed to the physician, and the closing check asked of the patient (tusi, ji).
  signal_not_understood: "{patient} ਜੀ ਕਹਿ ਰਹੇ ਹਨ ਕਿ ਉਹ ਇਹ ਗੱਲ ਸਮਝ ਨਹੀਂ ਸਕੇ। ਕੀ ਤੁਸੀਂ ਇਸਨੂੰ ਕਿਸੇ ਹੋਰ ਤਰੀਕੇ ਨਾਲ ਕਹਿ ਸਕਦੇ ਹੋ?"
  signal_not_understood_unnamed: "ਮਰੀਜ਼ ਕਹਿ ਰਹੇ ਹਨ ਕਿ ਉਹ ਇਹ ਗੱਲ ਸਮਝ ਨਹੀਂ ਸਕੇ। ਕੀ ਤੁਸੀਂ ਇਸਨੂੰ ਕਿਸੇ ਹੋਰ ਤਰੀਕੇ ਨਾਲ ਕਹਿ ਸਕਦੇ ਹੋ?"
  signal_slower: "{patient} ਜੀ ਤੁਹਾਨੂੰ ਥੋੜ੍ਹਾ ਧੀਮੇ ਬੋਲਣ ਲਈ ਕਹਿ ਰਹੇ ਹਨ।"
  signal_slower_unnamed: "ਮਰੀਜ਼ ਤੁਹਾਨੂੰ ਥੋੜ੍ਹਾ ਧੀਮੇ ਬੋਲਣ ਲਈ ਕਹਿ ਰਹੇ ਹਨ।"
  ask_if_clear: "{patient} ਜੀ, ਕੀ ਅੱਜ ਡਾਕਟਰ ਜੀ ਨੇ ਕੋਈ ਅਜਿਹੀ ਗੱਲ ਕਹੀ ਹੈ ਜੋ ਤੁਸੀਂ ਦੁਬਾਰਾ ਸਮਝਣਾ ਚਾਹੋਗੇ?"
  ask_if_clear_unnamed: "ਕੀ ਅੱਜ ਡਾਕਟਰ ਜੀ ਨੇ ਕੋਈ ਅਜਿਹੀ ਗੱਲ ਕਹੀ ਹੈ ਜੋ ਤੁਸੀਂ ਦੁਬਾਰਾ ਸਮਝਣਾ ਚਾਹੋਗੇ?"
  # ADR-003: said to the speaker of an unclear turn, in their language only. "Was not heard clearly" avoids the
  # interpreter's gender (ਸਕਿਆ or ਸਕੀ).
  ask_to_repeat: "ਮਾਫ਼ ਕਰਨਾ ਜੀ, ਇਹ ਗੱਲ ਸਾਫ਼ ਸੁਣਾਈ ਨਹੀਂ ਦਿੱਤੀ। ਕੀ ਤੁਸੀਂ ਇਸਨੂੰ ਦੁਬਾਰਾ ਕਹਿ ਸਕਦੇ ਹੋ?"
  ask_to_repeat_named: "ਮਾਫ਼ ਕਰਨਾ {name} ਜੀ, ਇਹ ਗੱਲ ਸਾਫ਼ ਸੁਣਾਈ ਨਹੀਂ ਦਿੱਤੀ। ਕੀ ਤੁਸੀਂ ਇਸਨੂੰ ਦੁਬਾਰਾ ਕਹਿ ਸਕਦੇ ਹੋ?"
