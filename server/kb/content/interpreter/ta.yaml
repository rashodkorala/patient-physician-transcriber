# The interpreter's own lines in Tamil, Sri Lankan usage (TDM-003 test language). Draft by Claude: Tamil
# speaker to review. Tamil first-person verbs here carry no gender, so any voice can say them.
reviewer: pending
lines:
  introduction: வணக்கம். நான் இந்தச் சந்திப்புக்கான மொழிபெயர்ப்பாளர். நீங்கள் இருவரும் சொல்லும் அனைத்தையும் உங்கள் சொந்த மொழியில் நான் தெரிவிப்பேன்.
  ask_physician_name: டொக்டர், நான் உங்களை எந்தப் பெயரில் அழைக்க வேண்டும்?
  ask_patient_name: தயவுசெய்து உங்கள் பெயரைச் சொல்லுங்கள்.
  ask_patient_name_with_physician: இன்று உங்கள் வைத்தியர் {physician}. தயவுசெய்து உங்கள் பெயரைச் சொல்லுங்கள்.
  welcome: நன்றி. நீங்கள் தயாரானதும் பேசத் தொடங்கலாம்.
  welcome_with_patient: நன்றி {patient}. நீங்கள் தயாரானதும் பேசத் தொடங்கலாம்.
  # CDR-008: the patient's signals relayed to the physician, and the closing check, in the respectful plural.
  signal_not_understood: "{patient} அது தங்களுக்குப் புரியவில்லை என்று சொல்கிறார்கள். தயவுசெய்து அதை வேறு விதமாகச் சொல்ல முடியுமா?"
  signal_not_understood_unnamed: "நோயாளி அது தங்களுக்குப் புரியவில்லை என்று சொல்கிறார்கள். தயவுசெய்து அதை வேறு விதமாகச் சொல்ல முடியுமா?"
  signal_slower: "{patient} உங்களை மெதுவாகப் பேசக் கேட்கிறார்கள்."
  signal_slower_unnamed: "நோயாளி உங்களை மெதுவாகப் பேசக் கேட்கிறார்கள்."
  ask_if_clear: "{patient}, இன்று வைத்தியர் சொன்னவற்றில் மீண்டும் விளக்க வேண்டும் என்று நீங்கள் விரும்பும் ஏதேனும் உண்டா?"
  ask_if_clear_unnamed: "இன்று வைத்தியர் சொன்னவற்றில் மீண்டும் விளக்க வேண்டும் என்று நீங்கள் விரும்பும் ஏதேனும் உண்டா?"
  # ADR-003: said to the speaker of an unclear turn, in their language only, in the respectful plural.
  ask_to_repeat: "மன்னிக்கவும், அது எனக்குத் தெளிவாகக் கேட்கவில்லை. தயவுசெய்து மீண்டும் சொல்ல முடியுமா?"
  ask_to_repeat_named: "மன்னிக்கவும் {name}, அது எனக்குத் தெளிவாகக் கேட்கவில்லை. தயவுசெய்து மீண்டும் சொல்ல முடியுமா?"
