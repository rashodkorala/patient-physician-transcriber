text: >-
  Cette consultation utilise un interprète IA. Il écoute ce que vous et votre médecin dites, le redit dans la
  langue de l'autre et l'affiche à cet écran. Un dossier de la conversation est conservé pour vos soins. Vous
  pouvez demander un interprète humain, ou faire une pause ou arrêter, en tout temps. Acceptez-vous de
  continuer?
