[project]
name = "demo-night-server"
version = "0.1.0"
description = "Demo night server: visit state, interpretation pipeline, and WebSocket channel (ADR-001)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "anthropic>=1.0",
    "httpx2",
    "langgraph>=1.0",
    "chromadb>=1.0",
    "pyyaml>=6",
    "rapidfuzz>=3",
    "elevenlabs>=2.75.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]
# Local multilingual embeddings (IDR-002). Installed by default; skipped only where the
# model cannot be downloaded (uv sync --no-group embeddings) and EMBEDDINGS=hashing is set.
embeddings = ["sentence-transformers>=3"]

[tool.uv]
default-groups = ["dev", "embeddings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter owns code line length; long lines left over are prompt prose.
ignore = ["E501"]
